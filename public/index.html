<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Reserva de Vagas</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div>
          <h1>Sistema de Reserva de Vagas</h1>
          <p>
            Projeto para cadastrar e consultar reservas usando
            comunicacao cliente-servidor e API REST.
          </p>
        </div>
        <div class="status" id="status">Conectando ao servidor...</div>
      </section>

      <section class="layout">
        <form class="panel" id="form-reserva">
          <h2>Cadastrar reserva</h2>

          <label for="nome">Nome</label>
          <input id="nome" name="nome" placeholder="Ex.: Henrique" required />

          <label for="vaga">Vaga</label>
          <input id="vaga" name="vaga" placeholder="Ex.: Vaga A01" required />

          <label for="mensagem">Mensagem</label>
          <textarea
            id="mensagem"
            name="mensagem"
            rows="4"
            placeholder="Ex.: Solicito reserva para o periodo da manha."
            required
          ></textarea>

          <button type="submit">Enviar reserva</button>
          <p class="feedback" id="feedback"></p>
        </form>

        <section class="panel">
          <div class="panel-header">
            <h2>Reservas cadastradas</h2>
            <button class="secondary" id="btn-atualizar" type="button">
              Atualizar
            </button>
          </div>
          <div class="lista" id="lista-reservas"></div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
