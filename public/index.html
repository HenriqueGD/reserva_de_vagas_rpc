<!DOCTYPE html>
<html>

<head>

    <title>
        Reserva de Estacionamento
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="formulario">

            <h1>
                Reserva de Estacionamento
            </h1>

            <input id="nome" placeholder="Nome">

            <input id="vaga" type="number" min="1" placeholder="Número da vaga">
            <button onclick="criarReserva()">
                Reservar
            </button>
        </div>

        <div class="reservas">

            <h2>
                Reservas Cadastradas
            </h2>

            <div class="lista-reservas">

                <ul id="lista"></ul>

            </div>

        </div>

    </div>

    <div class="processadas">

        <h2>
            Reservas Processadas (Socket.IO)
        </h2>

        <ul id="processadas"></ul>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>

</body>

</html>
