<!DOCTYPE html>
<html>

<head>

    <title>
        Reserva de Estacionamento
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>
        Reserva de Estacionamento
    </h1>

    <input
        id="nome"
        placeholder="Nome">

    <input
        id="vaga"
        placeholder="Vaga">

    <button onclick="criarReserva()">
        Reservar
    </button>

    <button onclick="listarReservas()">
        Ver Reservas
    </button>

    <h2>
        Reservas Cadastradas
    </h2>

    <ul id="lista"></ul>

    <h2>
        Reservas Processadas (Socket.IO)
    </h2>

    <ul id="processadas"></ul>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>

</body>

</html>
